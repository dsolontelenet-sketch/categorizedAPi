<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>APICat — URL Intelligence Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
:root {
  --bg:#080c10; --bg2:#0d1117; --bg3:#141b24; --border:#1e2d3d;
  --accent:#00e5ff; --accent2:#7df3a0; --warn:#ffb74d; --danger:#ff5252;
  --text:#c9d8e8; --text-dim:#566e84;
  --mono:'Space Mono',monospace; --sans:'Syne',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;overflow-x:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,229,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;}
body::after{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);pointer-events:none;z-index:0;opacity:.4;}
.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:32px 20px 80px;}
header{display:flex;align-items:center;gap:16px;margin-bottom:48px;border-bottom:1px solid var(--border);padding-bottom:24px;}
.logo-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--accent),#0057a8);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 20px rgba(0,229,255,.3);flex-shrink:0;}
.logo-text{flex:1;}
.logo-text h1{font-size:22px;font-weight:800;letter-spacing:1px;color:#fff;}
.logo-text h1 span{color:var(--accent);}
.logo-text p{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;letter-spacing:2px;}
.engine-badge{display:flex;align-items:center;gap:8px;background:rgba(66,133,244,.1);border:1px solid rgba(66,133,244,.3);border-radius:20px;padding:6px 14px;font-family:var(--mono);font-size:11px;color:#8ab4f8;white-space:nowrap;}
.status-dot{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--text-dim);white-space:nowrap;}
.status-dot.online{color:var(--accent2);}
.status-dot::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--text-dim);}
.status-dot.online::before{background:var(--accent2);box-shadow:0 0 8px var(--accent2);animation:pulse 2s infinite;}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.input-panel{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:28px;margin-bottom:32px;position:relative;overflow:hidden;}
.input-panel::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);}
.input-label{font-family:var(--mono);font-size:11px;color:var(--accent);text-transform:uppercase;letter-spacing:3px;margin-bottom:14px;display:block;}
.input-row{display:flex;gap:12px;}
.url-input{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:14px 18px;font-family:var(--mono);font-size:14px;color:var(--text);outline:none;transition:border-color .2s,box-shadow .2s;}
.url-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,229,255,.1);}
.url-input::placeholder{color:var(--text-dim);}
.scan-btn{background:linear-gradient(135deg,var(--accent),#0088cc);border:none;border-radius:8px;padding:14px 28px;font-family:var(--sans);font-size:14px;font-weight:600;color:#000;cursor:pointer;transition:opacity .2s,box-shadow .2s;white-space:nowrap;}
.scan-btn:hover{opacity:.9;box-shadow:0 0 20px rgba(0,229,255,.4);}
.scan-btn:active{transform:scale(.98);}
.scan-btn:disabled{opacity:.4;cursor:not-allowed;}
.loading-bar{display:none;margin-top:18px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;overflow:hidden;height:4px;}
.loading-bar.active{display:block;}
.loading-bar-inner{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));animation:sweep 1.4s ease-in-out infinite;}
@keyframes sweep{0%{width:0;margin-left:0}50%{width:60%;margin-left:20%}100%{width:0;margin-left:100%}}
.loading-msg{display:none;margin-top:12px;font-family:var(--mono);font-size:12px;color:var(--accent);}
.loading-msg.active{display:flex;align-items:center;gap:8px;}
.loading-msg::before{content:'▸';animation:blink .8s step-end infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.error-msg{display:none;background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.25);border-radius:10px;padding:14px 18px;font-family:var(--mono);font-size:12px;color:var(--danger);margin-top:16px;}
.error-msg.show{display:block;}
.result-panel{display:none;background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:32px;animation:slideUp .4s ease;}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.result-panel.show{display:block;}
.result-header{display:flex;align-items:center;justify-content:space-between;padding:18px 28px;border-bottom:1px solid var(--border);background:var(--bg3);gap:16px;}
.result-url{font-family:var(--mono);font-size:12px;color:var(--accent);word-break:break-all;}
.risk-badge{padding:4px 14px;border-radius:20px;font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;flex-shrink:0;}
.risk-low{background:rgba(125,243,160,.15);color:var(--accent2);border:1px solid rgba(125,243,160,.3);}
.risk-medium{background:rgba(255,183,77,.15);color:var(--warn);border:1px solid rgba(255,183,77,.3);}
.risk-high{background:rgba(255,82,82,.15);color:var(--danger);border:1px solid rgba(255,82,82,.3);}
.result-body{padding:28px;}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
.r-card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:18px;}
.r-label{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px;}
.r-value{font-size:16px;font-weight:600;color:#fff;}
.r-sub{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:4px;}
.conf-track{background:var(--bg);border-radius:4px;height:6px;margin-top:10px;overflow:hidden;}
.conf-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;transition:width 1s cubic-bezier(.4,0,.2,1);}
.reason-box{background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:0 10px 10px 0;padding:16px 20px;margin-bottom:20px;}
.reason-box p{font-size:14px;line-height:1.7;color:var(--text);}
.signals-wrap,.secondary-wrap{margin-bottom:20px;}
.sig-label{font-family:var(--mono);font-size:10px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:10px;}
.tags{display:flex;flex-wrap:wrap;gap:8px;}
.sig-tag{background:rgba(0,229,255,.08);border:1px solid rgba(0,229,255,.2);color:var(--accent);font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:4px;}
.sec-tag{background:rgba(100,100,120,.15);border:1px solid var(--border);color:var(--text-dim);font-family:var(--mono);font-size:11px;padding:4px 12px;border-radius:4px;}
.json-toggle{background:transparent;border:1px solid var(--border);border-radius:6px;color:var(--text-dim);font-family:var(--mono);font-size:11px;padding:6px 14px;cursor:pointer;transition:border-color .2s,color .2s;}
.json-toggle:hover{border-color:var(--accent);color:var(--accent);}
.json-view{display:none;margin-top:16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:20px;overflow-x:auto;}
.json-view.show{display:block;}
.json-view pre{font-family:var(--mono);font-size:12px;line-height:1.8;color:var(--text);white-space:pre-wrap;word-break:break-word;}
.json-key{color:#7dd3fc;}.json-str{color:#86efac;}.json-num{color:#fbbf24;}.json-bool{color:#f472b6;}.json-null{color:var(--text-dim);}
.history-section{margin-top:40px;}
.sec-title{font-family:var(--mono);font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:3px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);}
.history-list{display:flex;flex-direction:column;gap:10px;}
.h-item{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 20px;display:flex;align-items:center;gap:16px;cursor:pointer;transition:border-color .15s,background .15s;}
.h-item:hover{border-color:var(--accent);background:var(--bg3);}
.h-url{font-family:var(--mono);font-size:12px;color:var(--accent);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.h-cat{font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;}
.h-time{font-family:var(--mono);font-size:10px;color:var(--text-dim);white-space:nowrap;}
@media(max-width:640px){.result-grid{grid-template-columns:1fr;}.input-row{flex-direction:column;}}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo-icon">🔍</div>
    <div class="logo-text">
      <h1>API<span>Cat</span></h1>
      <p>URL Intelligence Engine · v2.0</p>
    </div>
    <div class="engine-badge">✦ Gemini · Firebase AI</div>
    <div class="status-dot" id="statusDot">LOADING</div>
  </header>

  <div class="input-panel">
    <span class="input-label">// Target URL</span>
    <div class="input-row">
      <input class="url-input" id="urlInput" type="text"
        placeholder="https://example.com" autocomplete="off" spellcheck="false" />
      <button class="scan-btn" id="scanBtn" onclick="classify()">⚡ Analyze</button>
    </div>
    <div class="loading-bar" id="loadingBar"><div class="loading-bar-inner"></div></div>
    <div class="loading-msg" id="loadingMsg">Gemini is analyzing the website…</div>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="result-panel" id="resultPanel">
    <div class="result-header">
      <span class="result-url" id="resUrl"></span>
      <span class="risk-badge" id="riskBadge"></span>
    </div>
    <div class="result-body">
      <div class="result-grid">
        <div class="r-card">
          <div class="r-label">Primary Category</div>
          <div class="r-value" id="catName">—</div>
          <div class="r-sub" id="catId">—</div>
        </div>
        <div class="r-card">
          <div class="r-label">AI Summary</div>
          <div class="r-value" id="aiSummary" style="font-size:14px">—</div>
          <div class="r-label" style="margin-top:12px;margin-bottom:4px">Confidence</div>
          <div class="r-sub" id="confValue">—</div>
          <div class="conf-track"><div class="conf-fill" id="confFill"></div></div>
        </div>
      </div>
      <div class="reason-box">
        <div class="r-label" style="margin-bottom:8px">Classification Reason</div>
        <p id="reason">—</p>
      </div>
      <div class="signals-wrap" id="signalsWrap"></div>
      <div class="secondary-wrap" id="secondaryWrap"></div>
      <button class="json-toggle" onclick="toggleJSON()">{ } Raw JSON</button>
      <div class="json-view" id="jsonView"><pre id="jsonPre"></pre></div>
    </div>
  </div>

  <div class="history-section" id="historySection" style="display:none">
    <div class="sec-title">Recent Scans</div>
    <div class="history-list" id="historyList"></div>
  </div>

</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
import { initializeAppCheck, ReCaptchaV3Provider }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app-check.js";
import { getFirestore, collection, addDoc, getDocs, orderBy, query, limit }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
import { getAI, getGenerativeModel, GoogleAIBackend }
  from "https://www.gstatic.com/firebasejs/11.0.0/firebase-ai.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCB71bM-oVA-kxi9miO55pmpU2-N3pbCUo",
  authDomain:        "apicat-cf3ed.firebaseapp.com",
  projectId:         "apicat-cf3ed",
  storageBucket:     "apicat-cf3ed.firebasestorage.app",
  messagingSenderId: "230026386638",
  appId:             "1:230026386638:web:c49cbb01d012daba44c49f",
  measurementId:     "G-4VET09Q391"
};

const app = initializeApp(firebaseConfig);

initializeAppCheck(app, {
  provider: new ReCaptchaV3Provider("123456"),
  isTokenAutoRefreshEnabled: true
});

const db    = getFirestore(app);
const ai    = getAI(app, { backend: new GoogleAIBackend() });
const model = getGenerativeModel(ai, {
  model: "gemini-2.0-flash",
  tools: [{ googleSearch: {} }]
});

const SYSTEM = `You are an enterprise URL classification engine (NetSTAR-style).

Given a URL, use Google Search to look up and understand the website's content, purpose, audience, and business model. Perform deep semantic analysis — not keyword matching.

TAXONOMY (use these IDs):
20005=Business & Commercial, 20008=Education, 20016=Health, 701=Gambling,
301=Adult/Porn, 902=Shopping/Retail, 20107=Generative AI, 20091=Social Networks,
402=Malware, 20108=Scams, 20001=News & Media, 20006=Finance & Banking,
20012=Government, 20003=Sports, 20002=Entertainment, 20014=Travel,
20010=Technology, 20004=Gaming, 20093=Forums & Communities, 501=Search Engines,
502=Email Services, 20109=Cloud Services, 20110=Cybersecurity, 20015=Job Boards,
20007=Real Estate, 20017=Food & Dining, 20009=Automotive, 20013=Legal,
20011=Religion & Spirituality, 20018=Arts & Culture, 20019=Science & Research,
20020=Politics, 99999=Other

RULES:
- Choose ONE primary category (most dominant intent)
- Ignore ads, nav menus, cookie banners
- Never return null or empty
- risk_level must be: low | medium | high
  - high  = malware, scams, adult, illegal content
  - medium = gambling, controversial, unverified
  - low   = everything else

RESPOND WITH ONLY THIS JSON — no markdown, no backticks, no extra text:
{
  "url": "<input url>",
  "category": { "id": "<id>", "name": "<name>" },
  "confidence": <0.00-1.00>,
  "reason": "<1-2 sentences>",
  "key_signals": ["signal1","signal2","signal3","signal4"],
  "secondary_categories": ["id name","id name"],
  "risk_level": "low|medium|high",
  "ai_summary": "<5-8 word label>"
}`;

const statusDot = document.getElementById("statusDot");
statusDot.textContent = "ONLINE";
statusDot.classList.add("online");

window.classify = async function () {
  const url = document.getElementById("urlInput").value.trim();
  if (!url) return;
  setLoading(true);
  hideError();
  hideResult();
  try {
    const result = await model.generateContent(`${SYSTEM}\n\nClassify this URL: ${url}`);
    const raw    = result.response.text();
    const data   = parseJSON(raw);
    renderResult(data);
    saveHistory(data);
  } catch (e) {
    showError(e.message || "Classification failed. Check console for details.");
    console.error(e);
  } finally {
    setLoading(false);
  }
};

function parseJSON(raw) {
  const c = raw.replace(/```json\s*/gi,"").replace(/```/g,"").trim();
  try { return JSON.parse(c); } catch(_) {}
  const m = c.match(/\{[\s\S]+\}/);
  if (m) { try { return JSON.parse(m[0]); } catch(_) {} }
  throw new Error("Could not parse response as JSON. Got: " + raw.slice(0,200));
}

function renderResult(d) {
  document.getElementById("resUrl").textContent    = d.url || "—";
  document.getElementById("catName").textContent   = d.category?.name || "Unknown";
  document.getElementById("catId").textContent     = "ID: " + (d.category?.id || "—");
  document.getElementById("aiSummary").textContent = d.ai_summary || "—";
  document.getElementById("reason").textContent    = d.reason || "—";

  const pct = Math.round((parseFloat(d.confidence)||0)*100);
  document.getElementById("confValue").textContent = pct + "%";
  setTimeout(() => { document.getElementById("confFill").style.width = pct + "%"; }, 100);

  const risk = (d.risk_level||"low").toLowerCase();
  const rb = document.getElementById("riskBadge");
  rb.textContent = risk.toUpperCase();
  rb.className   = "risk-badge risk-" + risk;

  document.getElementById("signalsWrap").innerHTML = d.key_signals?.length
    ? `<div class="sig-label">Key Signals</div><div class="tags">${d.key_signals.map(s=>`<span class="sig-tag">${esc(s)}</span>`).join("")}</div>`
    : "";

  document.getElementById("secondaryWrap").innerHTML = d.secondary_categories?.length
    ? `<div class="sig-label" style="margin-bottom:8px">Secondary Categories</div><div class="tags">${d.secondary_categories.map(s=>`<span class="sec-tag">${esc(s)}</span>`).join("")}</div>`
    : "";

  document.getElementById("jsonPre").innerHTML = syntaxHL(JSON.stringify(d,null,2));
  document.getElementById("jsonView").classList.remove("show");
  document.getElementById("resultPanel").classList.add("show");
}

async function saveHistory(data) {
  try {
    await addDoc(collection(db,"scans"), { ...data, timestamp: Date.now() });
    loadHistory();
  } catch(e) { console.warn("Firestore save:", e); }
}

async function loadHistory() {
  try {
    const q    = query(collection(db,"scans"), orderBy("timestamp","desc"), limit(10));
    const snap = await getDocs(q);
    const items = [];
    snap.forEach(doc => items.push(doc.data()));
    if (!items.length) return;
    document.getElementById("historySection").style.display = "block";
    document.getElementById("historyList").innerHTML = items.map(item => {
      const risk = (item.risk_level||"low").toLowerCase();
      const time = item.timestamp ? new Date(item.timestamp).toLocaleString() : "";
      return `<div class="h-item" onclick="document.getElementById('urlInput').value='${item.url.replace(/'/g,"\\'")}';window.scrollTo({top:0,behavior:'smooth'})">
        <span class="h-url">${esc(item.url)}</span>
        <span class="h-cat">${esc(item.category?.name||"—")}</span>
        <span class="risk-badge risk-${risk}" style="font-size:10px;padding:2px 10px">${risk.toUpperCase()}</span>
        <span class="h-time">${time}</span>
      </div>`;
    }).join("");
  } catch(e) { console.warn("Firestore load:", e); }
}

loadHistory();

function setLoading(on) {
  document.getElementById("loadingBar").classList.toggle("active", on);
  document.getElementById("loadingMsg").classList.toggle("active", on);
  const btn = document.getElementById("scanBtn");
  btn.disabled    = on;
  btn.textContent = on ? "Scanning…" : "⚡ Analyze";
}
function hideResult()   { document.getElementById("resultPanel").classList.remove("show"); document.getElementById("confFill").style.width="0%"; }
function showError(msg) { const e=document.getElementById("errorMsg"); e.textContent="⚠ "+msg; e.classList.add("show"); }
function hideError()    { document.getElementById("errorMsg").classList.remove("show"); }
window.toggleJSON = () => document.getElementById("jsonView").classList.toggle("show");
function esc(s) { return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function syntaxHL(json) {
  return esc(json).replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, m => {
    if(/^"/.test(m)) return /:$/.test(m)?`<span class="json-key">${m}</span>`:`<span class="json-str">${m}</span>`;
    if(/true|false/.test(m)) return `<span class="json-bool">${m}</span>`;
    if(/null/.test(m))       return `<span class="json-null">${m}</span>`;
    return `<span class="json-num">${m}</span>`;
  });
}

document.getElementById("urlInput").addEventListener("keydown", e => { if(e.key==="Enter") window.classify(); });
</script>
</body>
</html>
